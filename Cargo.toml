[package]
name = "codex-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "runtime_shaders",
    "wayland",
    "x11",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", branch = "main" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", branch = "main" }
codex-app-server-protocol = { git = "https://github.com/openai/codex.git", tag = "rust-v0.144.4" }
codex-protocol = { git = "https://github.com/openai/codex.git", tag = "rust-v0.144.4" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8.23"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", features = [
    "test-support",
] }

[patch."https://github.com/openai/codex.git"]
codex-shell-command = { path = "vendor/codex-shell-command" }

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16

# mirror configuration for crates compiled for the build platform
# (without this cargo will compile ~400 crates twice)
[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = true

[profile.dev.package]
# proc-macros start
gpui_macros = { opt-level = 3 }
derive_refineable = { opt-level = 3 }
util_macros = { opt-level = 3 }
quote = { opt-level = 3 }
syn = { opt-level = 3 }
proc-macro2 = { opt-level = 3 }
# proc-macros end

taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
cosmic-text = { opt-level = 3 }
fontdb = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
skrifa = { opt-level = 3 }
swash = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
unicode-script = { opt-level = 3 }
gpui = { opt-level = 3 }
gpui-base = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui_linux = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
gpui_wgpu = { opt-level = 3 }
collections = { opt-level = 3 }
sum_tree = { opt-level = 3 }
